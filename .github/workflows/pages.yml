# Publishes the browser edition (API, storage and AI all running in the browser) to
# GitHub Pages on every push to main. The same build runs on Hugging Face Spaces.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b
      - run: npx vite build --mode space --outDir dist-pages --emptyOutDir
      # GitHub Pages serves 404.html for unknown paths; the app routes in the URL hash.
      - run: cp dist-pages/index.html dist-pages/404.html && touch dist-pages/.nojekyll
      # Which commit is live: https://<site>/version.json
      - run: printf '{"commit":"%s","built_at":"%s"}\n' "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-pages/version.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
