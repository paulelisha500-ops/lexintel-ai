# Dependabot opens ONE pull request a month with every available update: the workflow
# actions, the frontend packages and the backend packages together. CI checks it; if the
# checks are green it is safe to merge. Major releases of frontend and backend packages
# are left out, because they can need code changes -- those are done by hand.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly
    commit-message:
      prefix: deps

updates:
  # The actions used by the workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  # Frontend packages (minor and patch releases)
  - package-ecosystem: npm
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Backend packages (minor and patch releases)
  - package-ecosystem: pip
    directory: /backend
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
