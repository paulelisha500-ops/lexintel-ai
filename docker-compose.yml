# Sized for a laptop running several projects: every service has a memory cap,
# so if one runs out it gets restarted on its own (restart: unless-stopped)
# instead of starving Docker's VM and freezing every container on the machine.

x-backend-common: &backend-common
  build: ./backend
  # One shared image for the API and the worker (built once, ~5.6 GB on disk).
  image: lexintel-ai-backend:latest
  env_file:
    - ./backend/.env
  restart: unless-stopped
  volumes:
    - ./backend:/app
    - lexintel_faiss_index:/app/data
    - lexintel_uploads:/data/uploads
    # HuggingFace/spaCy caches: models download once and survive container recreation.
    - lexintel_model_cache:/root/.cache

services:
  backend:
    <<: *backend-common
    # No --reload here on purpose. Watching the source needs polling across the
    # bind mount, and under memory pressure that watcher dies silently and the
    # API keeps serving the code it started with -- a confusing failure in a
    # system where a stale check is a wrong answer. Restart after backend edits:
    #   docker compose restart backend
    # For hot reload while editing, add the dev override:
    #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8005
    ports:
      - "8005:8005"
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 90s

  # Background jobs: complaint AI triage, OCR + case intelligence on evidence,
  # law-library ingestion, final transcription of stand recordings, nightly
  # re-scoring and search re-indexing (Celery beat, -B). A thread pool keeps a
  # single copy of the AI models in memory. The API runs a job in-process if
  # this worker is down, so nothing is lost.
  worker:
    <<: *backend-common
    command: celery -A app.worker.celery_app worker -B -l info --pool threads --concurrency 2 --schedule /tmp/celerybeat-schedule
    environment:
      # Borrow the API's embedding model instead of loading a second copy (~500 MB).
      EMBEDDINGS_URL: http://backend:8005/api/v1/internal/embed
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_USER: lexintel
      POSTGRES_PASSWORD: lexintel
      POSTGRES_DB: lexintel
    command: postgres -c shared_buffers=64MB -c max_connections=60
    ports:
      - "5434:5432"
    volumes:
      - lexintel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexintel -d lexintel"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    mem_limit: 384m
    # 0.25 is MongoDB's minimum; anything lower and it refuses to start.
    command: mongod --wiredTigerCacheSizeGB 0.25
    ports:
      - "27025:27017"
    volumes:
      - lexintel_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 160m
    command: redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy noeviction
    ports:
      - "6385:6379"
    volumes:
      - lexintel_redis_data:/data

  # Heap and page cache sized for a relationship graph of a few thousand nodes,
  # not for throughput: on this machine every 100 MB here is 100 MB the AI
  # models can't have.
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NEO4J_AUTH: neo4j/change-me-too
      NEO4J_server_memory_heap_initial__size: 160m
      NEO4J_server_memory_heap_max__size: 160m
      NEO4J_server_memory_pagecache_size: 96m
      NEO4J_server_jvm_additional: -XX:MaxMetaspaceSize=128m
    ports:
      - "7479:7474"
      - "7692:7687"
    volumes:
      - lexintel_neo4j_data:/data

  # Same reasoning as Neo4j: a single node indexing a few thousand documents.
  # Monitoring and other background features are off because each one costs
  # memory and CPU this machine needs elsewhere.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    restart: unless-stopped
    mem_limit: 768m
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - xpack.monitoring.collection.enabled=false
      - bootstrap.memory_lock=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m -XX:MaxDirectMemorySize=128m"
    ports:
      - "9205:9200"
    volumes:
      - lexintel_es_data:/usr/share/elasticsearch/data

  # Local writing model for research drafts and case briefs (qwen2.5 1.5B,
  # ~1.3 GB while loaded). It loads on the first draft and unloads after 5
  # idle minutes; one draft at a time. First run only:
  #
  #   docker compose exec ollama ollama pull qwen2.5:1.5b-instruct
  #
  # Not published on the host (the backend reaches it as http://ollama:11434),
  # so it never clashes with another Ollama on port 11434.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: 1800m
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "8"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - lexintel_ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "3005:3005"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8005/api/v1
      - VITE_WATCH_POLLING=true

volumes:
  lexintel_postgres_data:
  lexintel_mongo_data:
  lexintel_redis_data:
  lexintel_neo4j_data:
  lexintel_es_data:
  lexintel_faiss_index:
  lexintel_uploads:
  lexintel_model_cache:
  lexintel_ollama_models:
