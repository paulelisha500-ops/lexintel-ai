<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#92722A" />
    <meta name="description" content="LexIntel — court decision-support platform for case management, evidence, hearings and legal research." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Font files come from Google Fonts; their rules are part of the app stylesheet. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>LexIntel</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("lexintel.prefs") || "{}");
        var lang = s.lang === "ar" ? "ar" : "en";
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        if (s.theme === "dark" || (!s.theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>LexIntel needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
