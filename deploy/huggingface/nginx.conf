# nginx for the Hugging Face Space: runs unprivileged on the Space port,
# serves the built frontend and passes /api and /health to uvicorn.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # Courtroom recordings are the largest upload (MAX_RECORDING_MB).
    client_max_body_size 600m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7860;

        location /api/ {
            proxy_pass http://127.0.0.1:8005;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Drafts stream token by token; CPU drafting can be slow.
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location = /health {
            proxy_pass http://127.0.0.1:8005;
        }

        location /assets/ {
            root /app/static;
            expires 30d;
        }

        location / {
            root /app/static;
            try_files $uri /index.html;
        }
    }
}
